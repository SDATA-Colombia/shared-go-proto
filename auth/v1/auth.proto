syntax = "proto3";

package auth.v1;

import "google/protobuf/timestamp.proto";
import "google/api/annotations.proto";

option go_package = "github.com/SDATA-Colombia/shared-go-proto/auth/v1";

// -------------------------------------------------------------------
// Auth Entity message
// -------------------------------------------------------------------

message AuthEntity {
  string id = 1;
  string id_admin = 2;
  string correo = 3;

  bool estado = 4;
  bool bloqueado = 5;

  google.protobuf.Timestamp login_at = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
  google.protobuf.Timestamp deleted_at = 9;
}

// -------------------------------------------------------------------
// Request / Response
// -------------------------------------------------------------------

// -------------------------------------------------------------------
// CreateAuth
// -------------------------------------------------------------------
// Utilizado por ms-admin cuando se crea un administrador.
// La contraseña solamente viaja en esta operación interna
// y nunca forma parte de AuthEntity.
// -------------------------------------------------------------------

message CreateAuthReq {
  string id_admin = 1;
  string correo = 2;
  string contrasena = 3;
}

message CreateAuthRes {
  bool success = 1;
  string message = 2;
  AuthEntity data = 3;
}

// -------------------------------------------------------------------
// Login
// -------------------------------------------------------------------

message LoginReq {
  string correo = 1;
  string contrasena = 2;
}

message LoginRes {
  bool success = 1;
  string message = 2;
  string token_acceso = 3;
  string refrescar_token = 4;
  string tipo_token = 6;
  string id_admin = 7;
  int64 expira_en = 5;
}


// -------------------------------------------------------------------
// GetAuth
// -------------------------------------------------------------------

message GetAuthReq {
  string id = 1;
}

message GetAuthRes {
  bool success = 1;
  string message = 2;
  AuthEntity data = 3;
}

// -------------------------------------------------------------------
// ListAuth
// -------------------------------------------------------------------

message ListAuthReq {
  int32 page = 1;
  int32 limit = 2;
  string search = 3;
}

message ListAuthRes {
  bool success = 1;
  string message = 2;
  repeated AuthEntity data = 3;
  int64 total = 4;
}

// -------------------------------------------------------------------
// UpdateAuth
// -------------------------------------------------------------------

message UpdateAuthReq {
  string id = 1;
  AuthEntity data = 2;
}

message UpdateAuthRes {
  bool success = 1;
  string message = 2;
  AuthEntity data = 3;
}

// -------------------------------------------------------------------
// DeleteAuth
// -------------------------------------------------------------------

message DeleteAuthReq {
  string id = 1;
}

message DeleteAuthRes {
  bool success = 1;
  string message = 2;
}

// -------------------------------------------------------------------
// Service gRPC
// -------------------------------------------------------------------

service AuthService {

  rpc CreateAuth(CreateAuthReq) returns (CreateAuthRes) {
    option (google.api.http) = {
      post: "/api/v1/auth"
      body: "*"
    };
  }

  rpc GetAuth(GetAuthReq) returns (GetAuthRes) {
    option (google.api.http) = {
      get: "/api/v1/auth/{id}"
    };
  }

  rpc ListAuth(ListAuthReq) returns (ListAuthRes) {
    option (google.api.http) = {
      get: "/api/v1/auth"
    };
  }

  rpc UpdateAuth(UpdateAuthReq) returns (UpdateAuthRes) {
    option (google.api.http) = {
      put: "/api/v1/auth/{id}"
      body: "*"
    };
  }

  rpc DeleteAuth(DeleteAuthReq) returns (DeleteAuthRes) {
    option (google.api.http) = {
      delete: "/api/v1/auth/{id}"
    };
  }

}
