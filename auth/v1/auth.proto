syntax = "proto3";

package auth.v1;

import "google/protobuf/timestamp.proto";
import "google/api/annotations.proto";

option go_package = "github.com/SDATA-Colombia/shared-go-proto/auth/v1";

// -------------------------------------------------------------------
// Auth Entity message
// -------------------------------------------------------------------

message AuthEntity {
  string id = 1;
  string correo = 2;
  string id_sujeto = 3;
  string tipo_sujeto = 4;

  bool estado = 5;
  bool bloqueado = 6;

  google.protobuf.Timestamp login_at = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
  google.protobuf.Timestamp deleted_at = 10;
}

// -------------------------------------------------------------------
// Request / Response
// -------------------------------------------------------------------

// -------------------------------------------------------------------
// CreateAuth
// -------------------------------------------------------------------
// Utilizado por ms-admin cuando se crea un administrador.
// La contraseña solamente viaja en esta operación interna
// y nunca forma parte de AuthEntity.
// -------------------------------------------------------------------

message CreateAuthReq {
  string id_sujeto = 1;
  string tipo_sujeto = 2;
  string correo = 3;
  string contrasena = 4;
}

message CreateAuthRes {
  bool success = 1;
  string message = 2;
  AuthEntity data = 3;
}

// -------------------------------------------------------------------
// ListAuth
// -------------------------------------------------------------------

message ListAuthReq {
  int32 page = 1;
  int32 limit = 2;
  string search = 3;
}

message ListAuthRes {
  bool success = 1;
  string message = 2;
  repeated AuthEntity data = 3;
  int64 total = 4;
}

// -------------------------------------------------------------------
// Login
// -------------------------------------------------------------------

message LoginReq {
  string correo = 1;
  string contrasena = 2;
}

message LoginRes {
  bool success = 1;
  string message = 2;
  string token_acceso = 3;
  string refrescar_token = 4;
  string tipo_token = 5;
  string id_sujeto = 6;
  int64 expira_en = 7;
}

// -------------------------------------------------------------------
// Change Password
// -------------------------------------------------------------------

message ChangePasswordReq {
  string id_sujeto = 1;
  string contrasena_actual = 2;
  string nueva_contrasena = 3;
}

message ChangePasswordRes {
  bool success = 1;
  string message = 2;
}

// -------------------------------------------------------------------
// Reset Password
// -------------------------------------------------------------------
// Para recuperación de contraseña.
// No depende de que el usuario conozca la contraseña actual.
// -------------------------------------------------------------------

message ResetPasswordReq {
  string restablecer_token = 1;
  string nueva_contrasena = 2;
}

message ResetPasswordRes {
  bool success = 1;
  string message = 2;
}

// -------------------------------------------------------------------
// Refresh Token
// -------------------------------------------------------------------

message RefreshTokenReq {
  string refrescar_token = 1;
}

message RefreshTokenRes {
  bool success = 1;
  string message = 2;
  string token_acceso = 3;
  string refrescar_token = 4;
  string tipo_token = 5;
  int64 expira_en = 6;
}

// -------------------------------------------------------------------
// Logout
// -------------------------------------------------------------------

message LogoutReq {
  string refrescar_token = 1;
}

message LogoutRes {
  bool success = 1;
  string message = 2;
}

// -------------------------------------------------------------------
// GetAuth
// -------------------------------------------------------------------

message GetAuthReq {
  string id_sujeto = 1;
}

message GetAuthRes {
  bool success = 1;
  string message = 2;
  AuthEntity data = 3;
}

// -------------------------------------------------------------------
// Service gRPC
// -------------------------------------------------------------------

service AuthService {

  // ---------------------------------------------------------------
  // Internal service-to-service operation.
  // ms-admin -> ms-auth-admin
  // ---------------------------------------------------------------

  rpc CreateAuth(CreateAuthReq) returns (CreateAuthRes);

  rpc ListAuth(ListAuthReq) returns (ListAuthRes) {
    option (google.api.http) = {
      get: "/api/v1/auth/admin"
    };
  }

  // ---------------------------------------------------------------
  // Login
  // ---------------------------------------------------------------

  rpc Login(LoginReq) returns (LoginRes) {
    option (google.api.http) = {
      post: "/api/v1/auth/admin/login"
      body: "*"
    };
  }

  // ---------------------------------------------------------------
  // Change password
  // ---------------------------------------------------------------

  rpc ChangePassword(ChangePasswordReq) returns (ChangePasswordRes) {
    option (google.api.http) = {
      put: "/api/v1/auth/admin/password"
      body: "*"
    };
  }

  // ---------------------------------------------------------------
  // Reset password
  // ---------------------------------------------------------------

  rpc ResetPassword(ResetPasswordReq) returns (ResetPasswordRes) {
    option (google.api.http) = {
      post: "/api/v1/auth/admin/password/reset"
      body: "*"
    };
  }

  // ---------------------------------------------------------------
  // Refresh token
  // ---------------------------------------------------------------

  rpc RefreshToken(RefreshTokenReq) returns (RefreshTokenRes) {
    option (google.api.http) = {
      post: "/api/v1/auth/admin/refresh"
      body: "*"
    };
  }

  // ---------------------------------------------------------------
  // Logout
  // ---------------------------------------------------------------

  rpc Logout(LogoutReq) returns (LogoutRes) {
    option (google.api.http) = {
      post: "/api/v1/auth/admin/logout"
      body: "*"
    };
  }

  // -------------------------------------------------------------------
  // GetAuth
  // -------------------------------------------------------------------

  rpc GetAuth(GetAuthReq) returns (GetAuthRes);

}
